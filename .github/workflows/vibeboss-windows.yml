# VibeBoss: builds an unsigned Windows installer on a GitHub-hosted runner.
#   gh workflow run vibeboss-windows.yml --ref <branch> && gh run watch
name: VibeBoss Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install
        run: vp install

      - name: Build resource monitor
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build installer
        shell: bash
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --verbose

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VibeBoss-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: List packaged files
        if: failure()
        shell: bash
        run: find release -path '*unpacked*' -type f | sed 's#^release/##' | sort
